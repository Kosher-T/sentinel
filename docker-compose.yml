services:
  sentinel:
    build: .
    volumes:
      - .:/app
      - ./venv:/app/venv
    environment:
      - VIRTUAL_ENV=/app/venv
      - PATH=/app/venv/bin:$PATH
      - PYTHONPATH=/app:/app/venv/lib/python3.12/site-packages
    # GPU support disabled due to missing host runtime
    # Uncomment deploy section if NVIDIA Container Toolkit is installed
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    tty: true
